bundle:
  name: rearc_quest

variables:
  catalog:
    default: rearc
  contact_email:
    description: Sent in the User-Agent to BLS, as required by https://www.bls.gov/bls/pss.htm

resources:
  # One schema per medallion layer. In dev mode the bundle prefixes them, e.g. dev_<user>_bronze.
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Raw files (Volume), ingestion state and bronze streaming tables.
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Cleaned, typed, de-duplicated tables maintained by AUTO CDC FROM SNAPSHOT.
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: Answer tables (materialized views) for analysts, Genie and dashboards.

  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: raw
      volume_type: MANAGED

  pipelines:
    rearc_quest_pipeline:
      name: rearc_quest_pipeline
      catalog: ${var.catalog}
      # Default schema: bronze. Silver and gold datasets are published with fully qualified names.
      schema: ${resources.schemas.bronze.name}
      serverless: true
      root_path: ./src/pipeline
      # alternatives.py / alternatives.sql are documented alternatives and deliberately not run.
      libraries:
        - file:
            path: ./src/pipeline/bronze.py
        - file:
            path: ./src/pipeline/silver.py
        - file:
            path: ./src/pipeline/gold.sql
        - file:
            path: ./src/pipeline/gold.py
      configuration:
        raw_root: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/raw
        silver_schema: ${var.catalog}.${resources.schemas.silver.name}
        gold_schema: ${var.catalog}.${resources.schemas.gold.name}

  jobs:
    rearc_quest_job:
      name: rearc_quest_job
      tasks:
        - task_key: ingest
          environment_key: default
          spark_python_task:
            python_file: ./src/ingest.py
            parameters:
              - --target=/Volumes/${var.catalog}/${resources.schemas.bronze.name}/raw
              - --contact-email=${var.contact_email}
        - task_key: refresh_pipeline
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.rearc_quest_pipeline.id}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

targets:
  dev:
    mode: development
    default: true
